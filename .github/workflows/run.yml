name: Build and Test HMS (C++ Terminal)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install C++17 Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make

    - name: Build C++ HMS
      run: |
        make

    - name: Run Automated Test (Full OOP Showcase)
      run: |
        printf "10\n\n0\n" | ./hms

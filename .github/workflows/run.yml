name: Build and Test HMS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile and Test HMS
      run: |
        chmod +x build.sh
        javac -cp ".:sqlite-jdbc-3.42.0.0.jar" *.java
        echo "=== Running Headless Backend Test ==="
        java -Djava.awt.headless=true -cp ".:sqlite-jdbc-3.42.0.0.jar" Main
